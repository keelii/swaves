[package]
name = "swaves-markdown"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure markdown rendering crate for swaves"

[features]
default = ["highlight", "math", "mermaid"]
highlight = []
math = ["dep:katex"]
mermaid = []

[dependencies]
comrak = { version = "0.52.0", default-features = false, features = ["syntect"] }
katex = { version = "0.4.6", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.18"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "render"
harness = false
