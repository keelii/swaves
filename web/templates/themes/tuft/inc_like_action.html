<form method="post" action="{{ UrlFor('site.action.like', postID=Post.ID) }}" class="valign" data-like-form>
  <input type="hidden" name="return_url" value="{{ UrlPath }}">
  <button class="valign" title="点赞数" type="submit" data-like-button data-liked="{% if Liked %}1{% else %}0{% endif %}" aria-label="点赞">
    {{ LucideIcon("heart", 16) }}
    <span data-like-count>{% if LikeCount %}{{ LikeCount }}{% else %}0{% endif %}</span>
  </button>
</form>
<script async src="{{ StaticUrl('/static/site/like-action.js') }}"></script>
