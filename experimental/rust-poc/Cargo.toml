[package]
name = "swaves-rust-poc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
clap = { version = "4.5.39", features = ["derive"] }
minijinja = "2.12.0"
pulldown-cmark = "0.13.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-cron-scheduler = "0.13.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
